---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: "📁 File - Trim trailing whitespace"
      - id: end-of-file-fixer
        name: "📁 File - Files end in a newline"
      - id: check-yaml
        name: "📁 File - Check yaml"
        args: [--allow-multiple-documents]
      - id: check-json
        name: "📁 File - Check json"
      - id: check-toml
        name: "📁 File - Check toml"
      - id: check-case-conflict
        name: "📁 File - Check name for case insensitive OS"
      - id: check-illegal-windows-names
        name: "📁 File - Check illegal windows names"
      - id: check-added-large-files
        name: "🌲 Git - Block large file commits"
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
        name: "🌲 Git - Detect conflict markers"
      - id: detect-private-key
        name: "🔐 Security - Detect private keys"
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        name: "🌲 Git - Ensure commit follows Conventional Commits"
        stages: [commit-msg]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: "🔐 Security - Detect hardcoded secrets"
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.50
    hooks:
      - id: rumdl-fmt  # Auto-format and fail if issues remain
        name: "📄 Markdown - Format markdown"
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: "⚙️ Yaml - Lint Yaml file"
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        name: "⚙️ Yaml - Format Yaml file"
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        name: "🍒 Cpp - Format C++ file"
  - repo: local
    hooks:
      # Needs a local cppcheck install (e.g. `brew install cppcheck`).
      - id: cppcheck
        name: "🍒 Cpp - Static analysis"
        language: system
        entry: >-
          cppcheck --enable=warning,performance,portability --error-exitcode=1
        types_or: [c++, c]
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.28.0
    hooks:
      - id: gersemi
        name: "🏗️ CMake - Format CMake file"
  - repo: https://github.com/biomejs/pre-commit
    rev: v0.6.1
    hooks:
      - id: biome-check  # Format, organize import, lint and apply safe fix
        additional_dependencies: ["@biomejs/biome@2.5.8"]
        name: "🌐 Js, Ts, Json, Html, Css - Format, lint, safe fix"
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.72
    hooks:
      - id: ty
        name: "🐍 Ty - Typecheck Python file"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
        name: "🐍 Py - Lint Python file"
      # Run the formatter.
      - id: ruff-format
        name: "🐍 Py - Format Python file"
  # Local hooks calling the system cargo directly: no third-party wrapper
  # repo needed, but a Rust toolchain must be installed. Clippy runs the
  # compiler checks too, so a separate `cargo check` hook would be redundant.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: "⛴️ Rs - Format Rust file"
        language: system
        entry: cargo fmt --
        types: [rust]
      - id: cargo-clippy
        name: "⛴️ Rs - Lint Rust file"
        language: system
        entry: cargo clippy --all-targets -- -D warnings
        types: [rust]
        pass_filenames: false
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        name: "⌨️ Typos - Look for spelling mistakes"
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        name: "⚙️ TOML - Format Toml file"
